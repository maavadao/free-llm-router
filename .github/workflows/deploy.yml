name: Build and deploy

# Builds the container on GitHub Actions; on main, pushes it to Artifact Registry as free-llm-router
# and deploys it to the Cloud Run service free-llm-router (image only: its secrets and settings
# come from scripts/deploy.sh and are kept).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cloud-run:
    uses: maavadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: free-llm-router
      service: free-llm-router
