name: Build image

# Builds the container on GitHub Actions; on main, pushes it to Artifact Registry as free-llm-router.
# It isn't deployed to Cloud Run yet: that needs ROUTER_TOKENS and provider keys in Secret Manager
# first (see README). Then add `service: free-llm-router` below.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cloud-run:
    uses: maavadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: free-llm-router
